# Fetches prod the way social unfurlers do, from GitHub's datacenter IPs, so an edge setting
# that blocks them (Cloudflare Bot Fight Mode, 2026-09) fails loudly instead of silently
# breaking every shared link. Scheduled rather than per-push: the breakage came from the
# Cloudflare dashboard, not from code. Failed scheduled runs email the repo owner.
name: Link previews

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/check-link-previews.ts
      - .github/workflows/link-previews.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-link-previews.ts
